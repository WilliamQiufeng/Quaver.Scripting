[package]
name = "lib"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
memmap2 = "0.9.11"
mlua = { version = "0.12.0", features = ["luajit", "vendored", "macros", "userdata-wrappers", "send", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2.189"
seccompiler = "0.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
] }
